<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bộ hình cún nâu — duyệt tư thế</title>
<style>body{font:16px system-ui;background:#eaf5ff;color:#244561;margin:24px}h1{font-size:26px}p{max-width:800px}section{margin:28px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:#fff8ed;padding:12px;border-radius:16px;text-align:center;border:1px solid #ead9bc}.card svg{display:block;width:100%;height:150px}.card b{font-size:13px}#growth{display:flex;flex-wrap:wrap;gap:18px}#growth .card{width:220px}#growth svg{height:200px}</style>
<h1>🐶 Cún nâu lông xù</h1><p>Ba giai đoạn, cùng một bạn cún. Bảng dưới là các tư thế dùng trong Nhà cún; dữ liệu và luật nuôi giữ nguyên.</p>
<div id="growth"></div><p><label><input type="checkbox" id="tryBow"> Thử đeo nơ riêng trên các tư thế sơ sinh</label> · Đây là bản xem trước phụ kiện, chưa thêm vào shop.</p><main id="poses"></main>
<script src="../js/pet-view.js"></script>
<script>
PetView.artPath=s=>'../assets/pet/dog-fluffy-brown-stage'+s+'-v2.png';
PetView.bowPath=()=>'../assets/pet/bow-blue-tuft-v1.png';
const stages=['Cún sơ sinh','Cún lớn vừa','Trưởng thành'];
const names={idle:'Đứng',walk:'Đi bộ',sit:'Ngồi',sleep:'Ngủ',wake:'Thức dậy',eat:'Ăn',wag:'Vẫy đuôi',tilt:'Nghiêng đầu',hop:'Nhảy',sniff:'Đánh hơi',chase:'Chạy đuổi',happy:'Vui',celebrate:'Ăn mừng',rest:'Nằm nghỉ'};
document.getElementById('growth').innerHTML=stages.map((s,i)=>'<div class="card">'+PetView.svg(i)+'<b>'+s+'</b></div>').join('')+'<div class="card">'+PetView.svg(0,'idle',undefined,true)+'<b>Sơ sinh đeo nơ</b></div>';
function drawPoses(){const bow=document.getElementById('tryBow').checked;document.getElementById('poses').innerHTML=stages.map((s,i)=>'<section><h2>'+s+'</h2><div class="grid">'+Object.entries(names).map(([pose,label])=>'<div class="card">'+PetView.svg(i,pose,undefined,bow)+'<b>'+label+'</b></div>').join('')+'</div></section>').join('');}
document.getElementById('tryBow').onchange=drawPoses;drawPoses();
</script></html>
